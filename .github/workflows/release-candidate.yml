name: Release candidate

# One producer pack; every downstream consumer uses the same artifact ID.
# Candidate evidence is never enough to publish: promotion is a separate,
# environment-protected workflow (release-promote.yml).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to verify
        required: true
        default: 0.1.0-rc.5

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run smoke:remote
      - run: npm run smoke:client

  compatibility:
    runs-on: ubuntu-latest
    needs: source-gates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm install --global pnpm@12.3.4
      - run: pnpm --version
      - run: node scripts/verify/compat-matrix.mjs --discover > discovered-dsh.json
      - run: node scripts/verify/compat-matrix.mjs --versions all --out compat-matrix.json
      - name: Probe every newer untracked DSH version
        run: |
          set -euo pipefail
          node -e "const d=require('./discovered-dsh.json'); console.log([...new Set([...(d.newer??[]),...(d.distTagTargets??[])])].join('\n'))" > probe-list.txt
          while IFS= read -r version; do
            test -n "$version" || continue
            echo "probing untracked DSH $version"
            if node scripts/verify/compat-matrix.mjs --versions "$version" --out "new-dsh-$version.json"; then
              echo "::error::untracked DSH $version now passes; update declarations instead of continuing"
              exit 1
            fi
            node scripts/verify/check-untracked-probe.mjs "$version" "new-dsh-$version.json"
          done < probe-list.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: compat-evidence
          path: |
            compat-matrix.json
            discovered-dsh.json
            new-dsh-*.json
            probe-list.txt
          if-no-files-found: error

  producer-pack:
    runs-on: ubuntu-latest
    needs: source-gates
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact_name }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      pack-commit: ${{ steps.meta.outputs.pack_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Pack exactly once
        env:
          VERSION: ${{ inputs.version }}
        run: |
          rm -rf dist && mkdir -p dist
          npm pack --pack-destination dist
          test "$(find dist -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          TGZ=$(find dist -maxdepth 1 -name '*.tgz' | head -1)
          test "$(basename "$TGZ")" = "dsh-charter-$VERSION.tgz"
          tar -xOf "$TGZ" package/package.json | VERSION="$VERSION" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{if(JSON.parse(s).version!==process.env.VERSION)process.exit(1)})"
      - name: Write checksums and metadata
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TGZ=$(find dist -maxdepth 1 -name '*.tgz' | head -1)
          SHA=$(sha256sum "$TGZ" | awk '{print $1}')
          BASE=$(basename "$TGZ")
          printf '%s  %s\n' "$SHA" "$BASE" > dist/SHA256SUMS
          cp dist/SHA256SUMS SHA256SUMS
          printf 'sha256=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
          printf 'artifact-name=%s\n' "release-candidate" >> "$GITHUB_OUTPUT"
          printf 'pack-commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          SHA="$SHA" BASE="$BASE" node -e "const fs=require('fs');fs.writeFileSync('release-metadata.json',JSON.stringify({version:process.env.VERSION,commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,artifactSha256:process.env.SHA,artifact:process.env.BASE},null,2)+'\\n')"
          grep -q "sha256=$SHA" "$GITHUB_OUTPUT"
          grep -q "\"artifactSha256\": \"$SHA\"" release-metadata.json
          test "$(sha256sum "$TGZ" | awk '{print $1}')" = "$SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: |
            dist/*.tgz
            dist/SHA256SUMS
            release-metadata.json
          if-no-files-found: error

  exact-artifact:
    runs-on: ubuntu-latest
    needs: producer-pack
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: candidate
      - run: |
          npm ci
          mkdir -p dist
          cp candidate/*.tgz candidate/SHA256SUMS dist/
          npm run smoke:package -- --artifact "dist/$(ls dist/*.tgz | xargs -n1 basename)" --sha256 dist/SHA256SUMS

  packed-recovery:
    runs-on: ubuntu-latest
    needs: producer-pack
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: candidate
      - run: |
          npm ci
          mkdir -p dist
          cp candidate/*.tgz candidate/SHA256SUMS dist/
          node scripts/verify/recovery-smoke.mjs --artifact "dist/$(ls dist/*.tgz | xargs -n1 basename)" --sha256 dist/SHA256SUMS

  profile-matrix:
    runs-on: ubuntu-latest
    needs: producer-pack
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: candidate
      - name: Fresh DSH Web profile install and serve
        run: node scripts/verify/profile-smoke.mjs --artifact "candidate/$(basename candidate/*.tgz)" --sha256 candidate/SHA256SUMS 2>&1 | tee profile-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: profile-evidence
          path: profile-smoke.log
          if-no-files-found: error

  gateway-matrix:
    runs-on: ubuntu-latest
    needs: producer-pack
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: candidate
      - name: Real Gateway acceptance on the exact artifact
        run: |
          npm ci
          node scripts/verify/gateway-smoke.mjs --artifact "candidate/$(basename candidate/*.tgz)" --sha256 candidate/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: gateway-evidence
          path: .tmp/gateway-smoke.json
          if-no-files-found: error

  candidate-summary:
    if: always()
    runs-on: ubuntu-latest
    needs: [source-gates, compatibility, producer-pack, exact-artifact, packed-recovery, gateway-matrix, profile-matrix]
    steps:
      - name: Summarize candidate gates
        env:
          VERSION: ${{ inputs.version }}
          PACK_COMMIT: ${{ needs.producer-pack.outputs.pack-commit }}
          ARTIFACT_SHA256: ${{ needs.producer-pack.outputs.sha256 }}
        run: |
          printf 'Candidate version: %s\n' "$VERSION"
          printf 'Producer commit: %s\n' "$PACK_COMMIT"
          printf 'Artifact SHA-256: %s\n' "$ARTIFACT_SHA256"
          echo "A green candidate is not a release; promote it separately with release-promote.yml."
          test "${{ needs.source-gates.result }}" = success
          test "${{ needs.compatibility.result }}" = success
          test "${{ needs.producer-pack.result }}" = success
          test "${{ needs.exact-artifact.result }}" = success
          test "${{ needs.packed-recovery.result }}" = success
          test "${{ needs.gateway-matrix.result }}" = success
          test "${{ needs.profile-matrix.result }}" = success
