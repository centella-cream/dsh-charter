name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Real-model compaction is a manual release gate, never a CI step:
      #   npm run verify:compaction -- --session <id> --home <DSH_HOME>
      - run: npm run check
      - run: npm run smoke:package
