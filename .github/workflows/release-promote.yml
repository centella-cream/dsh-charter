name: Promote release candidate

# Protected, no-build/no-pack promotion. The candidate artifact is the only
# source of release bytes. Inputs are untrusted; use env: interpolation and
# validate every identifier before touching the repository or npm.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release candidate run id
        required: true
      candidate_commit:
        description: Pack source commit C (40 hex)
        required: true
      release_commit:
        description: C+1 release commit on main (40 hex)
        required: true
      candidate_sha256:
        description: Candidate tarball SHA-256 (64 hex)
        required: true
      version:
        description: Exact SemVer version, e.g. 0.1.0-rc.5
        required: true
      browser_evidence_run_id:
        description: Successful protected browser-evidence run id
        required: true

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: release-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      VERSION: ${{ inputs.version }}
      BROWSER_EVIDENCE_RUN_ID: ${{ inputs.browser_evidence_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with OIDC publish and dist-tag support
        run: |
          set -euo pipefail
          npm install --global npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          node -e 'const [major,minor]=process.versions.node.split(".").map(Number); if (!(major===22 && minor>=9) && major<24) process.exit(1)'
      - name: Validate inputs and main/release ordering
        run: |
          set -euo pipefail
          printf '%s' "$RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$CANDIDATE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$CANDIDATE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$VERSION" | grep -Eq '^0\.1\.0-rc\.[0-9]+$'
          printf '%s' "$BROWSER_EVIDENCE_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          git fetch origin main --prune
          git cat-file -e "$CANDIDATE_COMMIT^{commit}"
          git cat-file -e "$RELEASE_COMMIT^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_COMMIT" origin/main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
      - name: Verify the candidate run is the successful producer
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --json workflowName,event,conclusion,headSha,status > candidate-run.json
          node -e "const r=require('./candidate-run.json'); if(r.workflowName!=='Release candidate'||r.conclusion!=='success'||r.status!=='completed'||r.headSha!==process.env.CANDIDATE_COMMIT) { console.error(r); process.exit(1) }"
          gh run view "$RUN_ID" --log-failed >/dev/null 2>&1 || true
      - name: Download and verify the candidate artifact
        run: |
          set -euo pipefail
          rm -rf candidate && mkdir candidate
          gh run download "$RUN_ID" -n release-candidate -D candidate
          test "$(find candidate -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1
          SHA=$(sha256sum candidate/*.tgz | awk '{print $1}')
          test "$SHA" = "$CANDIDATE_SHA256"
          test "$(grep -c "$SHA" candidate/SHA256SUMS)" -ge 1
          export ARTIFACT_BASE="$(basename candidate/*.tgz)"
          node - <<'NODE'
          const fs = require('fs')
          const meta = JSON.parse(fs.readFileSync('candidate/release-metadata.json', 'utf8'))
          const checks = {
            version: process.env.VERSION,
            commit: process.env.CANDIDATE_COMMIT,
            runId: process.env.RUN_ID,
            artifactSha256: process.env.CANDIDATE_SHA256,
            artifact: process.env.ARTIFACT_BASE,
          }
          for (const [key, value] of Object.entries(checks)) {
            if (String(meta[key]) !== String(value)) throw new Error(`release-metadata.${key} mismatch`)
          }
          if (meta.artifact !== process.env.ARTIFACT_BASE) throw new Error('release-metadata.artifact mismatch')
          NODE
      - name: Preflight dist-tags against the current registry
        run: |
          set -euo pipefail
          CURRENT_LATEST=$(npm view dsh-charter dist-tags.latest)
          CURRENT_NEXT=$(npm view dsh-charter dist-tags.next)
          export CURRENT_LATEST CURRENT_NEXT VERSION
          node - <<'NODE'
          const currentLatest = process.env.CURRENT_LATEST
          const currentNext = process.env.CURRENT_NEXT
          const target = process.env.VERSION
          const rc = value => {
            const match = /^0\.1\.0-rc\.(\d+)$/u.exec(value)
            if (match === null) throw new Error(`unsupported current tag: ${value}`)
            return Number(match[1])
          }
          const targetRc = rc(target)
          for (const [name, current] of [['latest', currentLatest], ['next', currentNext]]) {
            if (current !== undefined && rc(current) > targetRc) {
              throw new Error(`refusing to move ${name} backward from ${current} to ${target}`)
            }
          }
          NODE
      - name: Verify protected browser evidence
        run: |
          set -euo pipefail
          gh run view "$BROWSER_EVIDENCE_RUN_ID" --json workflowName,event,status,conclusion,headSha > browser-run.json
          node -e "const r=require('./browser-run.json'); if(r.workflowName!=='Record browser recovery evidence'||r.event!=='workflow_dispatch'||r.status!=='completed'||r.conclusion!=='success') { console.error(r); process.exit(1) }"
          BROWSER_SHA=$(node -p "require('./browser-run.json').headSha")
          BROWSER_PATH=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BROWSER_EVIDENCE_RUN_ID" --jq .path)
          test "$BROWSER_PATH" = ".github/workflows/browser-evidence.yml"
          test "$BROWSER_SHA" = "$RELEASE_COMMIT"
          rm -rf browser-evidence && mkdir browser-evidence
          gh run download "$BROWSER_EVIDENCE_RUN_ID" -n browser-evidence -D browser-evidence
          test "$(find browser-evidence -maxdepth 1 -name 'browser-evidence.json' | wc -l)" -eq 1
          SHA="$CANDIDATE_SHA256" node - <<'NODE'
          const fs = require('fs')
          const evidence = JSON.parse(fs.readFileSync('browser-evidence/browser-evidence.json', 'utf8'))
          if (evidence.schemaVersion !== 1) throw new Error('schemaVersion')
          if (evidence.candidateSha256 !== process.env.SHA) throw new Error('browser evidence SHA mismatch')
          if (evidence.candidateRunId !== process.env.RUN_ID) throw new Error('browser evidence candidate run mismatch')
          if (evidence.candidateCommit !== process.env.CANDIDATE_COMMIT) throw new Error('browser evidence candidate commit mismatch')
          NODE
      - name: Verify C+1 changes only the root checksum
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$CANDIDATE_COMMIT" "$RELEASE_COMMIT")
          test "$CHANGED" = "SHA256SUMS"
          grep -q "$CANDIDATE_SHA256" SHA256SUMS
          test "$(node -p "require('./package.json').version")" = "$VERSION"
      - name: Verify exact CI success on C+1
        run: |
          set -euo pipefail
          gh run list --workflow ci.yml --commit "$RELEASE_COMMIT" --limit 50 --json databaseId,conclusion,status,headSha,event,headBranch > ci-runs.json
          node -e "const rs=require('./ci-runs.json').filter(r=>r.headSha===process.env.RELEASE_COMMIT&&r.status==='completed'&&r.conclusion==='success'&&r.event==='push'&&r.headBranch==='main'); if(rs.length===0) { console.error('no successful main-push CI run for release commit'); process.exit(1) }"
      - name: Re-run exact-artifact smoke without build or pack
        run: |
          set -euo pipefail
          npm ci
          mkdir -p dist && cp candidate/*.tgz dist/
          npm run smoke:package -- --artifact "dist/$(basename candidate/*.tgz)" --sha256 SHA256SUMS
          node scripts/verify/recovery-smoke.mjs --artifact "dist/$(basename candidate/*.tgz)" --sha256 SHA256SUMS
      - name: Tag, draft release, verify assets, and publish (reentrant)
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PUBLISHED=0
          if npm view "dsh-charter@$VERSION" version >/dev/null 2>&1; then
            rm -rf /tmp/existing && mkdir -p /tmp/existing
            npm pack "dsh-charter@$VERSION" --pack-destination /tmp/existing >/dev/null
            test "$(sha256sum /tmp/existing/*.tgz | awk '{print $1}')" = "$CANDIDATE_SHA256"
            PUBLISHED=1
          fi
          if git tag -l "$TAG" | grep -q .; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag -a "$TAG" -m "dsh-charter $VERSION sha256 $CANDIDATE_SHA256"
            git push origin "$TAG"
          fi
          RELEASE_STATE=$(gh release view "$TAG" --json isDraft,isPrerelease -q '.isDraft + ":" + .isPrerelease' 2>/dev/null || true)
          if [ -n "$RELEASE_STATE" ]; then
            rm -rf /tmp/release-assets && mkdir /tmp/release-assets
            gh release download "$TAG" -D /tmp/release-assets -p '*.tgz' -p 'SHA256SUMS'
            test "$(find /tmp/release-assets -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1
            test "$(find /tmp/release-assets -maxdepth 1 -name 'SHA256SUMS' | wc -l)" -eq 1
            test "$(sha256sum /tmp/release-assets/*.tgz | awk '{print $1}')" = "$CANDIDATE_SHA256"
            test "$(grep -c "$CANDIDATE_SHA256" /tmp/release-assets/SHA256SUMS)" -ge 1
            case "$RELEASE_STATE" in
              true:false|false:true) ;;
              *) echo "::error::existing release is neither draft nor published prerelease: $RELEASE_STATE"; exit 1 ;;
            esac
          else
            gh release create "$TAG" candidate/*.tgz candidate/SHA256SUMS               --title "dsh-charter $VERSION"               --notes-file "docs/release-notes/$VERSION.md"               --verify-tag --draft
            RELEASE_STATE="true:false"
          fi
          MAIN_CI_RUN=$(node -e "const rs=require('./ci-runs.json').filter(r=>r.headSha===process.env.RELEASE_COMMIT&&r.conclusion==='success'&&r.event==='push'&&r.headBranch==='main'); console.log(rs[0].databaseId)")
          cat > release-evidence.json <<EOF
          {
            "schemaVersion": 1,
            "version": "$VERSION",
            "candidateCommit": "$CANDIDATE_COMMIT",
            "releaseCommit": "$RELEASE_COMMIT",
            "candidateRunId": "$RUN_ID",
            "candidateSha256": "$CANDIDATE_SHA256",
            "browserEvidenceRunId": "$BROWSER_EVIDENCE_RUN_ID",
            "mainCiRunId": "$MAIN_CI_RUN",
            "tag": "$TAG",
            "artifact": "$(basename candidate/*.tgz)"
          }
          EOF
          gh release upload "$TAG" release-evidence.json --clobber
          if [ "$RELEASE_STATE" = "true:false" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          fi
          if [ "$PUBLISHED" -eq 0 ]; then
            npm publish "candidate/$(basename candidate/*.tgz)" --access public --tag next --provenance
          fi
          # Re-read tags immediately before mutation and refuse any rollback.
          CURRENT_LATEST=$(npm view dsh-charter dist-tags.latest)
          CURRENT_NEXT=$(npm view dsh-charter dist-tags.next)
          CURRENT_LATEST="$CURRENT_LATEST" CURRENT_NEXT="$CURRENT_NEXT" VERSION="$VERSION" node - <<'NODE'
          const parse = value => {
            const match = /^0\.1\.0-rc\.(\d+)$/u.exec(value ?? '')
            return match === null ? null : Number(match[1])
          }
          const target = parse(process.env.VERSION)
          for (const [name, current] of [['latest', process.env.CURRENT_LATEST], ['next', process.env.CURRENT_NEXT]]) {
            const rc = parse(current)
            if (rc !== null && rc > target) throw new Error(`refusing ${name} rollback ${current} -> ${process.env.VERSION}`)
          }
          NODE
          npm dist-tag add "dsh-charter@$VERSION" next
          npm dist-tag add "dsh-charter@$VERSION" latest
          npm dist-tag ls dsh-charter > dist-tags.txt
          grep -q "next: $VERSION" dist-tags.txt
          grep -q "latest: $VERSION" dist-tags.txt
      - name: Verify registry version, tags, and downloaded digest
        run: |
          set -euo pipefail
          npm view "dsh-charter@$VERSION" version
          npm dist-tag ls dsh-charter > dist-tags.txt
          grep -q "next: $VERSION" dist-tags.txt
          grep -q "latest: $VERSION" dist-tags.txt
          npm pack "dsh-charter@$VERSION" --pack-destination /tmp/published >/dev/null
          test "$(sha256sum /tmp/published/*.tgz | awk '{print $1}')" = "$CANDIDATE_SHA256"
