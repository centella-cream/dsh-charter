<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">依赖关系：测试与迁移是发布的前置条件</title>
  <desc id="desc">三张交付物卡片。测试 D1 与迁移 D2 是发布 D3 的前置条件，带方向依赖箭头。</desc>
  <style>
    .surface { fill: #151820; }
    .frame { fill: none; stroke: #2c333e; }
    .kicker { fill: #8e98a8; font: 600 11px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .12em; }
    .lane { fill: #6f7989; font: 500 11px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .04em; }
    .node { fill: #1b1f27; stroke: #343c49; stroke-width: 1; }
    .node-selected { stroke: #4ea1ff; }
    .accent-done { fill: #3fb950; }
    .accent-progress { fill: #4ea1ff; }
    .accent-waiting { fill: #d29922; }
    .node-key { fill: #7fb7ff; font: 600 12px/1.2 "SFMono-Regular", Consolas, monospace; }
    .node-title { fill: #e8ebf1; font: 600 15px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .node-meta { fill: #8f99a9; font: 400 11px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    .chip { fill: #242a34; stroke: #343c49; }
    .chip-text { fill: #b9c2d0; font: 500 10px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .status-done { fill: #3fb950; }
    .status-progress { fill: #4ea1ff; }
    .status-waiting { fill: #d29922; }
    .edge { fill: none; stroke: #7d8798; stroke-width: 1.5; }
    .edge-label { fill: #8e98a8; font: 400 10px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .hint { fill: #7e8898; font: 400 11px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .legend-line { fill: none; stroke: #7d8798; stroke-width: 1.5; }
    .legend-dot { fill: #3fb950; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7d8798"/>
    </marker>
  </defs>

  <rect class="surface" x="0.5" y="0.5" width="959" height="319" rx="14"/>
  <rect class="frame" x="0.5" y="0.5" width="959" height="319" rx="14"/>

  <text class="kicker" x="32" y="36">执行路径</text>
  <text class="lane" x="32" y="64">前置条件先于依赖项可见</text>

  <!-- lane guide -->
  <line x1="32" y1="80" x2="928" y2="80" stroke="#252c36" stroke-width="1"/>
  <text class="lane" x="32" y="100">执行</text>
  <text class="lane" x="520" y="100">依赖项</text>

  <!-- D1 Tests -->
  <g>
    <rect class="node" x="32" y="118" width="236" height="82" rx="8"/>
    <rect class="accent-done" x="32" y="118" width="3" height="82" rx="1.5"/>
    <circle class="status-done" cx="52" cy="140" r="3"/>
    <text class="node-key" x="62" y="144">D1</text>
    <rect class="chip" x="190" y="128" width="62" height="20" rx="10"/>
    <text class="chip-text" x="221" y="142" text-anchor="middle">已完成</text>
    <text class="node-title" x="52" y="169">测试</text>
    <text class="node-meta" x="52" y="188">无前置</text>
  </g>

  <!-- D2 Migration -->
  <g>
    <rect class="node" x="32" y="218" width="236" height="82" rx="8"/>
    <rect class="accent-progress" x="32" y="218" width="3" height="82" rx="1.5"/>
    <circle class="status-progress" cx="52" cy="240" r="3"/>
    <text class="node-key" x="62" y="244">D2</text>
    <rect class="chip" x="174" y="228" width="78" height="20" rx="10"/>
    <text class="chip-text" x="213" y="242" text-anchor="middle">进行中</text>
    <text class="node-title" x="52" y="269">迁移</text>
    <text class="node-meta" x="52" y="288">无前置</text>
  </g>

  <!-- D3 Release -->
  <g>
    <rect class="node node-selected" x="520" y="160" width="260" height="98" rx="8"/>
    <rect class="accent-waiting" x="520" y="160" width="3" height="98" rx="1.5"/>
    <circle class="status-waiting" cx="540" cy="184" r="3"/>
    <text class="node-key" x="550" y="188">D3</text>
    <rect class="chip" x="700" y="174" width="66" height="20" rx="10"/>
    <text class="chip-text" x="733" y="188" text-anchor="middle">等待</text>
    <text class="node-title" x="540" y="217" fill="#e8ebf1">发布</text>
    <text class="node-meta" x="540" y="237" fill="#8f99a9">2 个前置 · 等待 D1、D2</text>
  </g>

  <!-- edges: D1 -> D3 and D2 -> D3 -->
  <path class="edge" d="M 268 158 C 340 158, 400 185, 516 196" marker-end="url(#arrow)"/>
  <path class="edge" d="M 268 258 C 340 258, 400 225, 516 218" marker-end="url(#arrow)"/>
  <text class="edge-label" x="338" y="142">依赖 D1</text>
  <text class="edge-label" x="338" y="286">依赖 D2</text>

  <!-- legend / note -->
  <line class="legend-line" x1="32" y1="306" x2="62" y2="306"/>
  <text class="hint" x="72" y="310">实线 = 生效依赖 · D1、D2 完成后 D3 才进入 prompt</text>
</svg>
